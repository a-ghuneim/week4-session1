<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Checkout Page</title>
  </head>
  <body>
    <header>
      <nav>
        <img src="logo.svg" />
        <ol>
          <li>Home</li>
          <li>Shop</li>
          <li>Cart</li>
          <li class="active">Checkout</li>
        </ol>
      </nav>
    </header>
    <main>
      <section class="checkout-inputs">
        <h2>Billing & Shipping</h2>
        <form>
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" placeholder="John Smith" required />
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="example@mail.com" required />
          <label for="phone-number">Phone Number:</label>
          <input type="number" id="phone-number" placeholder="+96170000000" required />
          <div class="row-display country-city">
            <div class="col-display">
              <label for="country">Country / Region:</label>
              <select name="country" id="country">
                <option value="">--Please choose an option--</option>
                <option value="lebanon">Lebanon</option>
              </select>
            </div>
            <div class="col-display">
              <label for="city">City:</label>
              <input id="city" type="text" placeholder="California" required />
            </div>
          </div>
          <label for="address">Address:</label>
          <input type="text" id="address" placeholder="Street 123, Bldg. 105" required />
          <label for="additional-info">Additional Information:</label>
          <textarea id="additional-info" placeholder="I want the order to be packed in cartoon box..." rows="5"></textarea>
        </form>
      </section>
      <section class="summary-and-total">
        <section class="order-summary">
          <h2>Your Order</h2>
          <table id="order-products">
            <tr>
              <th>Product</th>
              <th>Quantity</th>
              <th>Subtotal</th>
            </tr>
          </table>
          <table>
            <tr>
              <th>Subtotal</th>
              <td>100$</td>
            </tr>
          </table>
          <div class="shipping-method">
            <h3>Shipping Method:</h3>
            <form>
              <input id="delivery" type="radio" name="shipping-method" value="delivery" checked/>
              <label for="delivery">Delivery</label>
              <input type="radio" id="pickup" name="shipping-method" value="pickup"/>
              <label for="pickup">Pickup</label>
            </form>
          </div>
          <div class="payment-method">
            <h3>Payment Method:</h3>
            <form>
              <input type="radio" id="card" name="payment-method" value="card" checked/>
              <label for="card">Credit Card</label>
              <input type="radio" id="cash" name="payment-method" value="cash"/>
              <label for="cash">Cash on Delivery</label>
            </form>
          </div>
          <button class="place-order">Place Order</button>
        </section>
      </section>
    </main>
  </body>
  <script src="script.js"></script>
</html>
